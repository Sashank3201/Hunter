<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Solo Leveling style calisthenics quest tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<title>Hunter System</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><i></i>Hunter System</div>
    <div class="bar-r"><div class="when" id="when"></div><button class="sys-btn" data-act="menu" aria-label="Open System menu">System</button></div>
  </header>
  <main>
    <section id="status"></section>
    <section id="quest" hidden></section>
    <section id="progress" hidden></section>
    <section id="diet" hidden></section>
  </main>
</div>
<nav class="nav" aria-label="Sections">
  <button data-t="status" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z"/></svg>Status</button>
  <button data-t="quest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h3"/></svg>Quest</button>
  <button data-t="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V14M10 20V9M16 20V5M22 20H2"/></svg>Progress</button>
  <button data-t="diet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/></svg>Diet</button>
</nav>
<div class="layer" id="workout" role="dialog" aria-modal="true" aria-label="Workout" hidden></div>
<div class="layer" id="menu" role="dialog" aria-modal="true" aria-label="System menu" hidden></div>
<div class="layer" id="awaken" role="dialog" aria-modal="true" aria-label="Awakening" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/views.js"></script>
<script src="js/workout.js"></script>
<script src="js/awaken.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
</html>
